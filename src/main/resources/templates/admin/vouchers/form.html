<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Voucher</title>
<link rel="stylesheet" th:href="@{/css/admin-catalog.css}"></head><body><div class="app">
<aside th:replace="~{admin/fragments/nav :: menu('vouchers')}"></aside><main>
<div class="breadcrumb"><a th:href="@{/admin/voucher}">Voucher</a><span>/</span><span th:text="${voucherId == null} ? 'Them' : 'Sua'">Them</span></div>
<div class="top"><h1 th:text="${voucherId == null} ? 'T&#7841;o voucher m&#7899;i' : 'Ch&#7881;nh s&#7917;a voucher'">Them</h1></div>
<div class="notice error" th:if="${error}" th:text="${error}"></div>
<div class="panel"><form method="post" th:object="${form}"
th:action="${voucherId == null} ? @{/admin/voucher/them} : @{/admin/voucher/{id}/sua(id=${voucherId})}">
<div class="grid">
<label class="field">M&#227; voucher *<input th:field="*{code}" maxlength="40" pattern="[A-Za-z0-9_-]{3,40}" required placeholder="VD: WELCOME10"></label>
<label class="field">Lo&#7841;i gi&#7843;m *<select th:field="*{loaiGiam}"><option value="PHAN_TRAM">Ph&#7847;n tr&#259;m (%)</option><option value="CO_DINH">S&#7889; ti&#7873;n (VND)</option></select></label>
<label class="field">Gi&#225; tr&#7883; gi&#7843;m *<input type="number" min="0.01" step="0.01" th:field="*{giaTriGiam}" required></label>
<label class="field">Gi&#225; tr&#7883; &#273;&#417;n t&#7889;i thi&#7875;u (VND)<input type="number" min="0" step="0.01" th:field="*{giaTriDonToiThieu}" required></label>
<label class="field">Gi&#7843;m t&#7889;i &#273;a (VND, kh&#244;ng b&#7855;t bu&#7897;c)<input type="number" min="0.01" step="0.01" th:field="*{giamToiDa}"></label>
<label class="field">S&#7889; l&#432;&#7907;ng ph&#225;t h&#224;nh *<input type="number" min="0" step="1" th:field="*{soLuong}" required></label>
<label class="field">B&#7855;t &#273;&#7847;u (gi&#7901; Vi&#7879;t Nam) *<input type="datetime-local" th:field="*{ngayBatDau}" required></label>
<label class="field">K&#7871;t th&#250;c (gi&#7901; Vi&#7879;t Nam) *<input type="datetime-local" th:field="*{ngayKetThuc}" required></label>
<p class="hint">Người lập: <strong th:text="${signedInStaff.fullName()}">Quản lý đăng nhập</strong>. Hệ thống gán người lập khi tạo voucher, không lấy ID từ biểu mẫu.</p>
<label class="field">Tr&#7841;ng th&#225;i<select th:field="*{trangThai}"><option value="true">B&#7853;t</option><option value="false">T&#7841;m d&#7915;ng</option></select></label>
<label class="field full">M&#244; t&#7843;<textarea th:field="*{moTa}" maxlength="500" rows="2"></textarea></label>
</div><div class="buttons"><button>L&#432;u voucher</button><a class="btn secondary" th:href="@{/admin/voucher}">H&#7911;y</a></div></form></div>
</main></div></body></html>
