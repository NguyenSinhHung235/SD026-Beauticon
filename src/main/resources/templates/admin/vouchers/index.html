<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voucher - BeautIcon</title>
<link rel="stylesheet" th:href="@{/css/admin-catalog.css}">  <link rel="stylesheet" th:href="@{/css/admin-brand.css}">
  <script defer th:src="@{/js/admin-shell.js}"></script>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body><div class="app"><aside th:replace="~{admin/fragments/nav :: menu('vouchers')}"></aside><main>
<div class="top"><div><p class="eyebrow">Ban hang / Uu dai</p><h1>Qu&#7843;n l&#253; Voucher</h1>
</div>
<a class="btn" th:if="${isAdmin}" th:href="@{/admin/voucher/them}">+ T&#7841;o voucher</a></div>
<div class="notice" th:if="${success}" th:text="${success}"></div><div class="notice error" th:if="${error}" th:text="${error}"></div>
<div class="panel"><div class="table-scroll"><table>
<thead><tr><th>Code</th><th>Gi&#7843;m</th><th>&#272;&#417;n t&#7889;i thi&#7875;u</th><th>&#272;&#227; d&#249;ng / S&#7889; l&#432;&#7907;ng</th><th>Hi&#7879;u l&#7921;c (VN)</th><th>Tr&#7841;ng th&#225;i</th><th>Thao t&#225;c</th></tr></thead>
<tbody><tr th:each="v : ${items}">
<td><strong th:text="${v.code}">WELCOME10</strong><small th:text="|#${v.id}|">#1</small></td>
<td th:text="${v.type == 'PHAN_TRAM'} ? ${v.value + '%'} : ${v.value + ' VND'}">10%</td>
<td class="num" th:text="${v.minimum}">100000</td>
<td class="num" th:text="|${v.used} / ${v.quantity}|">0/100</td>
<td><span th:text="${v.startText}">01/01</span><small th:text="|den ${v.endText}|">02/01</small></td>
<td><span class="pill" th:classappend="${v.active} ? ' on' : ' off'" th:text="${v.active} ? (${v.inWindow} ? 'Con hieu luc' : 'Ngoai han') : 'Tam dung'">Con hieu luc</span></td>
<td><div class="actions"><a class="btn tiny secondary" th:href="@{/admin/voucher/{id}/sua(id=${v.id})}">S&#7917;a</a>
<form method="post" th:if="${isAdmin}" th:action="@{/admin/voucher/{id}/trang-thai(id=${v.id})}"><input type="hidden" name="active" th:value="${!v.active}">
<button class="tiny" th:classappend="${v.active} ? ' danger' : ' secondary'" th:text="${v.active} ? 'Tam dung' : 'Bat lai'">Tam dung</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="empty">Ch&#432;a c&#243; voucher.</td></tr>
</tbody></table></div></div></main></div></body></html>
