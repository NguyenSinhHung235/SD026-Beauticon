<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biểu mẫu nhân viên • BeautIcon</title><link rel="stylesheet" th:href="@{/css/admin-catalog.css}">  <link rel="stylesheet" th:href="@{/css/admin-brand.css}">
  <script defer th:src="@{/js/admin-shell.js}"></script>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body><div class="app"><aside th:replace="~{admin/fragments/nav :: menu('staff')}"></aside><main>
<div class="top"><div><p class="eyebrow">Quản trị / Nhân viên</p><h1 th:text="${employeeId == null ? 'Thêm nhân viên' : 'Sửa nhân viên'}">Nhân viên</h1></div>
<a class="btn secondary" th:href="@{/admin/nhan-vien}">← Quay lại</a></div>
<div class="notice error" th:if="${error}" th:text="${error}"></div>
<section class="panel"><form method="post" th:object="${form}"
  th:action="${employeeId == null} ? @{/admin/nhan-vien/them} : @{/admin/nhan-vien/{id}/sua(id=${employeeId})}">
<div class="grid">
<label class="field">Họ tên *<input th:field="*{hoTen}" required minlength="2" maxlength="150"></label>
<label class="field">Email đăng nhập *<input th:field="*{email}" type="email" required maxlength="254" autocomplete="off"></label>
<label class="field">Vai trò *<select th:field="*{chucDanh}" required><option value="NHAN_VIEN">Nhân viên (Staff)</option><option value="QUAN_LY">Quản lý (Admin)</option></select></label>
<label class="field"><span th:text="${employeeId == null ? 'Mật khẩu khởi tạo *' : 'Mật khẩu mới (để trống nếu không đổi)'}"></span>
<input type="password" th:field="*{matKhau}" th:required="${employeeId == null}" minlength="12" maxlength="128" autocomplete="new-password">
<small>Tối thiểu 12 ký tự; lưu dạng BCrypt, không hiển thị lại sau khi tạo.</small></label>
</div><div class="buttons"><button type="submit">Lưu nhân viên</button><a class="btn secondary" th:href="@{/admin/nhan-vien}">Hủy</a></div>
</form>
</section></main></div></body></html>
