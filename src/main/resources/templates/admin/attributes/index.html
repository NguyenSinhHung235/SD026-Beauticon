<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý thuộc tính • BeautIcon</title><link rel="stylesheet" th:href="@{/css/admin-catalog.css}">  <link rel="stylesheet" th:href="@{/css/admin-brand.css}">
  <script defer th:src="@{/js/admin-shell.js}"></script>
<link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body><div class="app"><aside th:replace="~{admin/fragments/nav :: menu('attributes')}"></aside><main>
<div class="top"><div><p class="eyebrow">Hàng hóa / Thuộc tính</p><h1 th:text="${kind.title}">Màu sắc</h1></div>
<a class="btn" th:if="${isAdmin}" th:href="@{/admin/thuoc-tinh/{s}/them(s=${kind.slug})}">＋ Thêm mới</a></div>
<div class="notice" th:if="${success}" th:text="${success}"></div>
<div class="panel"><form class="toolbar" method="get" th:action="@{/admin/thuoc-tinh/{s}(s=${kind.slug})}">
<input type="search" placeholder="Tìm theo tên..." name="q" th:value="${q}"><button type="submit">Tìm kiếm</button>
<a class="btn secondary" th:href="@{/admin/thuoc-tinh/{s}(s=${kind.slug})}">Xóa lọc</a></form>
<div class="table-scroll"><table class="compact"><thead><tr><th>ID</th><th>Tên</th>
<th th:if="${kind.has('ma_mau')}">Mã màu</th><th th:if="${kind.has('quoc_gia')}">Quốc gia</th>
<th th:if="${kind.has('sdt')}">Liên hệ</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="item : ${items}">
<td class="num" th:text="|#${item.id}|">#1</td><td><strong th:text="${item.ten}">Tên</strong></td>
<td th:if="${kind.has('ma_mau')}"><span th:text="${item.maMau}">#ABCDEF</span></td>
<td th:if="${kind.has('quoc_gia')}" th:text="${item.quocGia}">Việt Nam</td>
<td th:if="${kind.has('sdt')}"><span th:text="${item.sdt}">098</span><small th:text="${item.email}"></small></td>
<td style="max-width:250px;white-space:normal" th:text="${item.moTa}">Mô tả</td>
<td><span class="pill" th:classappend="${item.active} ? ' on' : ' off'" th:text="${item.active} ? 'Đang dùng' : 'Đã ẩn'">Đang dùng</span></td>
<td><div class="actions"><a class="btn tiny secondary" th:if="${isAdmin}" th:href="@{/admin/thuoc-tinh/{s}/{id}/sua(s=${kind.slug},id=${item.id})}">Sửa</a>
<form method="post" th:if="${isAdmin}" th:action="@{/admin/thuoc-tinh/{s}/{id}/trang-thai(s=${kind.slug},id=${item.id})}">
<input type="hidden" name="active" th:value="${!item.active}"><button class="tiny" th:classappend="${item.active} ? ' danger' : ' secondary'" th:text="${item.active} ? 'Ẩn' : 'Khôi phục'" type="submit">Ẩn</button></form>
</div></td></tr>
<tr th:if="${#lists.isEmpty(items)}"><td class="empty" colspan="8">Chưa có dữ liệu.</td></tr>
</tbody></table></div></div>
</main></div></body></html>
