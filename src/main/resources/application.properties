spring.application.name=vongtay-dashboard
server.port=${PORT:8080}
# SSL self-signed chi de test local. Production phai dung certificate hop le (trustServerCertificate=false).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=VongTayNu;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Schema duoc tao bang sql/01_schema.sql, khong cho Hibernate tu sinh bang.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Stage 5: create a one-time admin only when BOTH env variables are provided.
# Remove/unset these environment variables after the first successful login.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
